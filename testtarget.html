<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>razorshell test target</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      font-size: 20px;
      max-width: 60rem;
      margin: 2rem auto;
    }
    label { display: block; margin-top: 1.5rem; }
    input, textarea {
      font-size: 24px;
      font-family: monospace;
      width: 100%;
      box-sizing: border-box;
    }
    .state { color: #8cf; }
    .note { color: #fa5; font-size: 16px; display: block; }
    .editable {
      font-size: 24px;
      white-space: pre-wrap;
      border: 1px solid #888;
      padding: 0.25rem;
    }
    #keyinfo {
      position: sticky;
      top: 0;
      background: #111;
      color: #8f8;
      padding: 0.5rem 0;
      border-bottom: 1px solid #444;
    }
  </style>
</head>
<body>
  <h1>razorshell test target</h1>
  <div id="keyinfo">last keydown: -</div>

  <label>text
    <input type="text" value="hello world new order">
  </label>
  <label>email
    <span class="note">shortcuts do not apply here: the selection API
      does not exist on type=email, so razorshell leaves it native</span>
    <input type="email" value="user@example.com">
  </label>
  <label>search
    <input type="search" value="hello world new order">
  </label>
  <label>tel
    <input type="tel" value="03 1234 5678">
  </label>
  <label>url
    <input type="url" value="https://example.com/hello/world">
  </label>
  <label>password
    <input type="password" value="hunter2 secret phrase">
  </label>
  <label>textarea
    <textarea rows="4">first line
second line
third</textarea>
  </label>
  <label>contenteditable
    <span class="note" id="ce-status">razorshell status unknown</span>
    <div contenteditable="true" class="editable">first line
second line
third</div>
  </label>

  <script>
    document.querySelectorAll("input, textarea").forEach((field) => {
      const state = document.createElement("div");
      state.className = "state";
      field.parentElement.appendChild(state);
      setInterval(() => {
        state.textContent =
          `start=${field.selectionStart} end=${field.selectionEnd} len=${field.value.length}`;
      }, 100);
    });

    const ceStatus = document.getElementById("ce-status");
    document.addEventListener("razorshell-status", (e) => {
      const status = JSON.parse(e.detail);
      ceStatus.textContent = status.contentEditable
        ? "enabled in options"
        : "disabled in options: turn on 'Enable in rich text editors' to use shortcuts here";
    });
    setInterval(() => {
      document.dispatchEvent(new CustomEvent("razorshell-status-query"));
    }, 1000);

    document.addEventListener("keydown", (e) => {
      document.getElementById("keyinfo").textContent =
        `last keydown: key=${e.key} code=${e.code} ctrl=${e.ctrlKey} alt=${e.altKey}` +
        ` composing=${e.isComposing} prevented=${e.defaultPrevented}` +
        ` @${e.target.tagName.toLowerCase()}${e.target.type ? "[" + e.target.type + "]" : ""}`;
    });
  </script>
</body>
</html>
