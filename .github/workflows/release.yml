name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ahead of vitest: the storybook project runs its stories in a real
      # chromium, so the browser has to exist before the suite starts.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec vitest run

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm test:e2e

      - name: Package dist
        run: |
          cd dist
          zip -r "../razorshell-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: razorshell-*.zip
          generate_release_notes: true
