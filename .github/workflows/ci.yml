name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run

      - run: pnpm lint

      - run: pnpm build

      # Builds the stories to prove they compile; test:storybook is omitted for
      # the same reason as test:visual, its baselines being win32 screenshots.
      - run: pnpm build-storybook

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # test:visual is omitted: its baselines are win32 screenshots, which a
      # linux runner cannot reproduce.
