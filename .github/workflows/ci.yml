name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ahead of vitest: the storybook project runs its stories in a real
      # chromium, so the browser has to exist before the suite starts.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec vitest run

      - run: pnpm lint

      - run: pnpm build

      # Builds the stories to prove they compile; test:storybook is omitted for
      # the same reason as test:visual, its baselines being win32 screenshots.
      - run: pnpm build-storybook

      - run: pnpm test:e2e

  # The screenshot baselines are win32, so their comparison runs on the
  # windows runner rather than being skipped outright. Whether the runner's
  # Server-based font rendering matches locally captured baselines is
  # empirical; a mismatch here means the baselines and the runner disagree,
  # not that the UI broke.
  snapshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium

      - run: pnpm build

      - run: pnpm build-storybook

      - run: pnpm test:visual

      - run: pnpm test:storybook

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: snapshot-diffs
          path: test-results/
          retention-days: 7
